  <text x="95" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">STEP BACK</text><text x="412" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">LOWER BOTH KNEES</text>
  <g fill="none" stroke="#176b87" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="158" cy="126" r="15" fill="#b9e2ec"/><path d="M158 143v65m0-49-27 15m27-15 28 15m-28 34-21 54m21-54 21 54m-42 0h-14m56 0h14"/>
    <circle cx="470" cy="126" r="15" fill="#b9e2ec"/><path d="M470 143v58m0-42-28 12m28-12 29 12m-29 30 25 35m-25-35-44 36m44-36 37 36m-37-36 49-8m-86 44h-13m87 0h14"/>
