<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Bodyweight Squat</title><desc id="desc">Original side-view bodyweight squat sequence showing standing and controlled hip-and-knee bend with feet planted.</desc>
  <rect width="640" height="360" rx="24" fill="#f3f7fb"/><text x="32" y="46" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">BODYWEIGHT SQUAT</text>
  <text x="95" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">STAND</text><text x="412" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">SIT BETWEEN HIPS</text>
  <g fill="none" stroke="#176b87" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="158" cy="126" r="15" fill="#b9e2ec"/><path d="M158 143v65m-1-49-30 15m30-15 30 15m-30 34-21 54m21-54 21 54m-42 0h-14m56 0h14"/>
    <circle cx="470" cy="126" r="15" fill="#b9e2ec"/><path d="M470 143l-8 58m0-43-32 12m32-12 30 12m-30 31-42 30m42-30 34 27m-76 3h-14m90-3h14"/>
  </g><path d="M282 180h54m-12-12 12 12-12 12" fill="none" stroke="#7b9bad" stroke-width="4"/>
  <text x="32" y="314" font-family="Arial,sans-serif" font-size="16" fill="#17324d">Keep the whole foot planted and knees tracking over toes; stand smoothly.</text>
</svg>
