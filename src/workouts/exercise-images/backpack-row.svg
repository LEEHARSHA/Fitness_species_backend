<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Backpack Bent-Over Row</title><desc id="desc">Original home-workout side-view sequence showing a hip hinge and a securely held backpack row toward the lower ribs.</desc>
  <rect width="640" height="360" rx="24" fill="#f3f7fb"/><text x="32" y="46" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">BACKPACK BENT-OVER ROW</text>
  <text x="105" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">HINGE</text><text x="414" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">ROW TO RIBS</text>
  <g fill="none" stroke="#176b87" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="158" cy="122" r="15" fill="#b9e2ec"/><path d="M146 137l-39 55m20-29-33 5m33-5 18 26m-38-26-12 62m50-36-2 37m-48-1h-12m60 1h12"/><rect x="123" y="173" width="31" height="39" rx="5" fill="#f2bc78" stroke="#db7b2b" stroke-width="4"/>
    <circle cx="470" cy="122" r="15" fill="#b9e2ec"/><path d="M458 137l-39 55m20-29-20 14m20-14 18 15m-38-15-12 62m50-36-2 37m-48-1h-12m60 1h12"/><rect x="447" y="165" width="31" height="39" rx="5" fill="#f2bc78" stroke="#db7b2b" stroke-width="4"/>
  </g><path d="M282 180h54m-12-12 12 12-12 12" fill="none" stroke="#7b9bad" stroke-width="4"/>
  <text x="32" y="314" font-family="Arial,sans-serif" font-size="16" fill="#17324d">Use a closed, light pack; keep a neutral back and pull toward lower ribs.</text>
</svg>
