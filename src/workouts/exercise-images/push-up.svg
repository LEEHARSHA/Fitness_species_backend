<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Standard Push-Up</title><desc id="desc">Original floor-level sequence showing a straight-body high plank, controlled chest lowering, and pressing back up.</desc>
  <rect width="640" height="360" rx="24" fill="#f3f7fb"/><text x="32" y="46" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">STANDARD PUSH-UP</text>
  <text x="95" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">LOWER</text><text x="411" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">PRESS</text>
  <g fill="none" stroke="#176b87" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 254h220"/><circle cx="105" cy="176" r="14" fill="#b9e2ec"/><path d="M120 180l102 30 31 18m-72-9-33 25m103-16 23 26"/>
    <path d="M380 254h220"/><circle cx="420" cy="176" r="14" fill="#b9e2ec"/><path d="M435 180l102 30 31 18m-72-9-19 30m91-21 23 26"/>
  </g><path d="M282 180h54m-12-12 12 12-12 12" fill="none" stroke="#7b9bad" stroke-width="4"/>
  <text x="32" y="314" font-family="Arial,sans-serif" font-size="16" fill="#17324d">Maintain head-to-heels alignment; elbows angle back, not straight sideways.</text>
</svg>
