<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Incline Push-Up</title><desc id="desc">Original side-view sequence with hands on a stable raised surface and a straight body line during the push-up.</desc>
  <rect width="640" height="360" rx="24" fill="#f3f7fb"/><text x="32" y="46" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">INCLINE PUSH-UP</text>
  <text x="95" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">LOWER</text><text x="411" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">PRESS AWAY</text>
  <g fill="none" stroke="#176b87" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M68 254h205v-63h46v63"/><circle cx="117" cy="166" r="14" fill="#b9e2ec"/><path d="M132 171l88 37 31-9m-80-18-28 23 45 4m63-9 30-7"/>
    <path d="M373 254h205v-63h46v63"/><circle cx="423" cy="166" r="14" fill="#b9e2ec"/><path d="M438 171l88 37 31-9m-80-18-13 26 45-5m48-12 30-7"/>
  </g><path d="M282 180h54m-12-12 12 12-12 12" fill="none" stroke="#7b9bad" stroke-width="4"/>
  <text x="32" y="314" font-family="Arial,sans-serif" font-size="16" fill="#17324d">Hands stay elevated; keep head-to-heels alignment and elbows angled back.</text>
</svg>
