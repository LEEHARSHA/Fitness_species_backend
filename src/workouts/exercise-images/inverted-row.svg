  <text x="95" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">HANG BELOW BAR</text><text x="410" y="84" font-family="Arial,sans-serif" font-size="15" fill="#517087">PULL CHEST UP</text>
